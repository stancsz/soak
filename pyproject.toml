[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soak-testing-framework"
version = "0.1.0"
description = "Soak testing for agent harnesses and models"
requires-python = ">=3.11"

[project.scripts]
soak = "soak.cli:main"

[tool.setuptools.packages.find]
include = ["soak*"]
